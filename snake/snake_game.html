<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #gameCanvas {
            border: 3px solid #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            background: #000;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            color: white;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .controls {
            color: white;
            margin-top: 15px;
        }
        
        .start-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
            transition: all 0.3s;
        }
        
        .start-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            max-width: 200px;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            .container {
                padding: 20px;
                margin: 10px;
            }
            h1 {
                font-size: 2em;
            }
            #gameCanvas {
                width: 100%;
                max-width: 400px;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3D Snake Game</h1>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <button id="startBtn" class="start-btn">START GAME</button>
        
        <div class="stats">
            <div class="stat-item">
                Score: <span id="score">0</span>
            </div>
            <div class="stat-item">
                Level: <span id="level">1</span>
            </div>
            <div class="stat-item">
                High Score: <span id="highScore">0</span>
            </div>
        </div>
        
        <div class="controls">
            <p>Use WASD or Arrow Keys to move</p>
            <p>Space to pause | R to restart</p>
        </div>
        
        <div class="mobile-controls">
            <div></div>
            <button class="control-btn" id="upBtn">UP</button>
            <div></div>
            <button class="control-btn" id="leftBtn">LEFT</button>
            <button class="control-btn" id="pauseBtn">PAUSE</button>
            <button class="control-btn" id="rightBtn">RIGHT</button>
            <div></div>
            <button class="control-btn" id="downBtn">DOWN</button>
            <div></div>
        </div>
    </div>

    <script>
        class Snake3D {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gridSize = 20;
                this.tileCount = Math.floor(this.canvas.width / this.gridSize);
                
                this.snake = [{x: 10, y: 10}];
                this.food = this.generateFood();
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.level = 1;
                this.speed = 200;
                this.gameRunning = false;
                this.gameStarted = false;
                this.paused = false;
                this.particles = [];
                
                this.highScore = localStorage.getItem('snakeHighScore') || 0;
                document.getElementById('highScore').textContent = this.highScore;
                
                this.loadImages();
                this.setupControls();
                this.gameLoop();
            }
            
            loadImages() {
                this.images = {};
                
                // Create fruit images using canvas
                this.images.apple = this.createFruitImage('🍎', '#FF0000');
                this.images.orange = this.createFruitImage('🍊', '#FFA500');
                this.images.banana = this.createFruitImage('🍌', '#FFFF00');
                this.images.pineapple = this.createFruitImage('🍍', '#FFD700');
                
                // Create snake head and body images
                this.images.snakeHead = this.createSnakeImage('🐍', '#228B22');
                this.images.snakeBody = this.createSnakeImage('⬜', '#32CD32');
            }
            
            createFruitImage(emoji, color) {
                const canvas = document.createElement('canvas');
                canvas.width = this.gridSize;
                canvas.height = this.gridSize;
                const ctx = canvas.getContext('2d');
                
                // Draw fruit emoji
                ctx.font = `${this.gridSize-2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, this.gridSize/2, this.gridSize/2);
                
                return canvas;
            }
            
            createSnakeImage(emoji, color) {
                const canvas = document.createElement('canvas');
                canvas.width = this.gridSize;
                canvas.height = this.gridSize;
                const ctx = canvas.getContext('2d');
                
                // Draw snake part
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, this.gridSize, this.gridSize);
                ctx.font = `${this.gridSize-4}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(emoji, this.gridSize/2, this.gridSize/2);
                
                return canvas;
            }
            
            setupControls() {
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.startGame();
                });
                
                document.addEventListener('keydown', (e) => {
                    if (!this.gameRunning && e.code === 'KeyR') {
                        this.restart();
                        return;
                    }
                    
                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (this.gameStarted) this.togglePause();
                        return;
                    }
                    
                    if (!this.gameRunning || this.paused || !this.gameStarted) return;
                    
                    switch(e.code) {
                        case 'ArrowUp':
                        case 'KeyW':
                            if (this.dy === 0) { this.dx = 0; this.dy = -1; }
                            break;
                        case 'ArrowDown':
                        case 'KeyS':
                            if (this.dy === 0) { this.dx = 0; this.dy = 1; }
                            break;
                        case 'ArrowLeft':
                        case 'KeyA':
                            if (this.dx === 0) { this.dx = -1; this.dy = 0; }
                            break;
                        case 'ArrowRight':
                        case 'KeyD':
                            if (this.dx === 0) { this.dx = 1; this.dy = 0; }
                            break;
                    }
                });
                
                // Mobile controls
                document.getElementById('upBtn').addEventListener('click', () => {
                    if (this.dy === 0 && this.gameStarted) { this.dx = 0; this.dy = -1; }
                });
                document.getElementById('downBtn').addEventListener('click', () => {
                    if (this.dy === 0 && this.gameStarted) { this.dx = 0; this.dy = 1; }
                });
                document.getElementById('leftBtn').addEventListener('click', () => {
                    if (this.dx === 0 && this.gameStarted) { this.dx = -1; this.dy = 0; }
                });
                document.getElementById('rightBtn').addEventListener('click', () => {
                    if (this.dx === 0 && this.gameStarted) { this.dx = 1; this.dy = 0; }
                });
                document.getElementById('pauseBtn').addEventListener('click', () => {
                    if (this.gameStarted) this.togglePause();
                });
            }
            
            startGame() {
                this.gameStarted = true;
                this.gameRunning = true;
                this.dx = 1;
                this.dy = 0;
                document.getElementById('startBtn').style.display = 'none';
            }
            
            generateFood() {
                const fruits = [
                    {type: 'apple', value: 5, image: 'apple'},
                    {type: 'orange', value: 10, image: 'orange'},
                    {type: 'banana', value: 5, image: 'banana'},
                    {type: 'pineapple', value: 20, image: 'pineapple'}
                ];
                
                const randomFruit = fruits[Math.floor(Math.random() * fruits.length)];
                
                return {
                    x: Math.floor(Math.random() * this.tileCount),
                    y: Math.floor(Math.random() * Math.floor(this.canvas.height / this.gridSize)),
                    type: randomFruit.type,
                    value: randomFruit.value,
                    image: randomFruit.image
                };
            }
            
            drawImage(image, x, y) {
                const screenX = x * this.gridSize;
                const screenY = y * this.gridSize;
                
                // Draw 3D shadow effect
                this.ctx.fillStyle = 'rgba(0,0,0,0.3)';
                this.ctx.fillRect(screenX + 3, screenY + 3, this.gridSize, this.gridSize);
                
                // Draw the image
                this.ctx.drawImage(image, screenX, screenY, this.gridSize, this.gridSize);
            }
            
            createParticles(x, y, color) {
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: x * this.gridSize + this.gridSize / 2,
                        y: y * this.gridSize + this.gridSize / 2,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        life: 20,
                        color: color,
                        size: Math.random() * 3 + 1
                    });
                }
            }
            
            drawParticles() {
                this.particles.forEach((particle, index) => {
                    particle.life--;
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    this.ctx.globalAlpha = particle.life / 20;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                    
                    if (particle.life <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
                this.ctx.globalAlpha = 1;
            }
            
            update() {
                if (!this.gameRunning || this.paused || !this.gameStarted) return;
                
                const head = {x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy};
                
                // Wall collision
                if (head.x < 0 || head.x >= this.tileCount || 
                    head.y < 0 || head.y >= Math.floor(this.canvas.height / this.gridSize)) {
                    this.gameOver();
                    return;
                }
                
                // Self collision
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }
                
                this.snake.unshift(head);
                
                // Food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += this.food.value;
                    this.createParticles(this.food.x, this.food.y, '#FFD700');
                    this.food = this.generateFood();
                    
                    if (this.score % 50 === 0) {
                        this.level++;
                        this.speed = Math.max(100, this.speed - 20);
                    }
                } else {
                    this.snake.pop();
                }
                
                this.updateUI();
            }
            
            draw() {
                // Clear with gradient background
                const gradient = this.ctx.createLinearGradient(0, 0, this.canvas.width, this.canvas.height);
                gradient.addColorStop(0, '#1a1a2e');
                gradient.addColorStop(1, '#16213e');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw grid
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i <= this.tileCount; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i * this.gridSize, 0);
                    this.ctx.lineTo(i * this.gridSize, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i <= Math.floor(this.canvas.height / this.gridSize); i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i * this.gridSize);
                    this.ctx.lineTo(this.canvas.width, i * this.gridSize);
                    this.ctx.stroke();
                }
                
                // Draw food
                if (this.images[this.food.image]) {
                    this.drawImage(this.images[this.food.image], this.food.x, this.food.y);
                }
                
                // Draw snake
                this.snake.forEach((segment, index) => {
                    if (index === 0) {
                        this.drawImage(this.images.snakeHead, segment.x, segment.y);
                    } else {
                        this.drawImage(this.images.snakeBody, segment.x, segment.y);
                    }
                });
                
                // Draw particles
                this.drawParticles();
                
                // Draw overlays
                if (this.paused) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = '36px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                }
                
                if (!this.gameStarted) {
                    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.fillStyle = 'white';
                    this.ctx.font = '24px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Click START to begin!', this.canvas.width / 2, this.canvas.height / 2);
                }
            }
            
            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snakeHighScore', this.highScore);
                    document.getElementById('highScore').textContent = this.highScore;
                }
            }
            
            togglePause() {
                this.paused = !this.paused;
            }
            
            gameOver() {
                this.gameRunning = false;
                this.gameStarted = false;
                this.ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = 'white';
                this.ctx.font = '36px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = '18px Arial';
                this.ctx.fillText('Press R to restart', this.canvas.width / 2, this.canvas.height / 2 + 40);
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').textContent = 'RESTART GAME';
            }
            
            restart() {
                this.snake = [{x: 10, y: 10}];
                this.food = this.generateFood();
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.level = 1;
                this.speed = 200;
                this.gameRunning = false;
                this.gameStarted = false;
                this.paused = false;
                this.particles = [];
                this.updateUI();
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('startBtn').textContent = 'START GAME';
            }
            
            gameLoop() {
                this.update();
                this.draw();
                setTimeout(() => this.gameLoop(), this.speed);
            }
        }
        
        // Start game
        window.addEventListener('load', () => {
            new Snake3D();
        });
    </script>
</body>
</html>
