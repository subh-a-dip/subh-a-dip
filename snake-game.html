<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game - Play Now!</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        canvas {
            border: 3px solid #fff;
            border-radius: 10px;
            background: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .score {
            color: #fff;
            font-size: 24px;
            margin: 20px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .controls {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
        }
        .game-over {
            color: #ff6b6b;
            font-size: 20px;
            margin: 10px 0;
            display: none;
        }
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #45b7aa;
        }
        .mobile-controls {
            display: none;
            margin-top: 20px;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            justify-content: center;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background 0.2s;
        }
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
            }
            .controls {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            Desktop: Use Arrow Keys | Mobile: Use Touch Buttons<br>
            Eat the red apples to grow and score points!
        </div>
        
        <div class="mobile-controls">
            <div></div>
            <div class="control-btn" onclick="changeDirection('up')">↑</div>
            <div></div>
            <div class="control-btn" onclick="changeDirection('left')">←</div>
            <div></div>
            <div class="control-btn" onclick="changeDirection('right')">→</div>
            <div></div>
            <div class="control-btn" onclick="changeDirection('down')">↓</div>
            <div></div>
        </div>
        
        <button class="btn" id="startBtn" onclick="startGame()">🎮 Start Game</button>
        <div class="game-over" id="gameOver">Game Over! 🎮</div>
        <button class="btn" id="restartBtn" onclick="restartGame()" style="display:none;">🔄 Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake, food, dx, dy, score, gameRunning;

        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            gameRunning = false;
            scoreElement.textContent = score;
            randomFood();
            drawGame();
        }

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function drawGame() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4ecdc4';
            for (let part of snake) {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            }

            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function startGame() {
            gameRunning = true;
            startBtn.style.display = 'none';
            gameOverElement.style.display = 'none';
            restartBtn.style.display = 'none';
        }

        function moveSnake() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                randomFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
            restartBtn.style.display = 'inline-block';
        }

        function restartGame() {
            initGame();
            startGame();
        }

        function changeDirection(direction) {
            if (!gameRunning) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            switch(direction) {
                case 'up':
                    if (!goingDown) { dx = 0; dy = -1; }
                    break;
                case 'down':
                    if (!goingUp) { dx = 0; dy = 1; }
                    break;
                case 'left':
                    if (!goingRight) { dx = -1; dy = 0; }
                    break;
                case 'right':
                    if (!goingLeft) { dx = 1; dy = 0; }
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            switch(e.keyCode) {
                case 37: // Left
                    if (!goingRight) { dx = -1; dy = 0; }
                    break;
                case 38: // Up
                    if (!goingDown) { dx = 0; dy = -1; }
                    break;
                case 39: // Right
                    if (!goingLeft) { dx = 1; dy = 0; }
                    break;
                case 40: // Down
                    if (!goingUp) { dx = 0; dy = 1; }
                    break;
            }
        });

        function gameLoop() {
            moveSnake();
            drawGame();
        }

        initGame();
        setInterval(gameLoop, 150);
    </script>
</body>
</html>
