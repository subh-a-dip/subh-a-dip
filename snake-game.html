<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { color: #fff; margin-bottom: 15px; font-size: 2em; }
        .score { color: #fff; font-size: 18px; margin: 10px 0; font-weight: bold; }
        canvas {
            border: 2px solid #fff;
            border-radius: 8px;
            background: #000;
            display: block;
            margin: 10px auto;
        }
        .controls { color: #fff; margin: 10px 0; font-size: 12px; }
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.3s;
        }
        .btn:hover { background: #45b7aa; }
        .game-over { color: #ff6b6b; font-size: 18px; margin: 10px 0; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="300"></canvas>
        <div class="controls">Use Arrow Keys to move • Eat red apples to grow!</div>
        <button class="btn" id="startBtn">🎮 Start Game</button>
        <div class="game-over hidden" id="gameOver">Game Over! 🎮</div>
        <button class="btn hidden" id="restartBtn">🔄 Play Again</button>
    </div>

    <script>
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.scoreElement = document.getElementById('score');
                this.gameOverElement = document.getElementById('gameOver');
                this.startBtn = document.getElementById('startBtn');
                this.restartBtn = document.getElementById('restartBtn');
                
                this.gridSize = 15;
                this.tileCount = this.canvas.width / this.gridSize;
                
                this.reset();
                this.setupEventListeners();
                this.draw();
            }
            
            reset() {
                this.snake = [{x: 10, y: 10}];
                this.food = this.generateFood();
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.gameRunning = false;
                this.gameStarted = false;
                
                this.scoreElement.textContent = this.score;
                this.gameOverElement.classList.add('hidden');
                this.restartBtn.classList.add('hidden');
                this.startBtn.classList.remove('hidden');
            }
            
            generateFood() {
                let newFood;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * (this.canvas.width / this.gridSize)),
                        y: Math.floor(Math.random() * (this.canvas.height / this.gridSize))
                    };
                } while (this.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
                return newFood;
            }
            
            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.fillStyle = '#4ecdc4';
                this.snake.forEach((segment, index) => {
                    if (index === 0) this.ctx.fillStyle = '#45b7aa';
                    else this.ctx.fillStyle = '#4ecdc4';
                    this.ctx.fillRect(segment.x * this.gridSize + 1, segment.y * this.gridSize + 1, this.gridSize - 2, this.gridSize - 2);
                });
                
                this.ctx.fillStyle = '#ff6b6b';
                this.ctx.fillRect(this.food.x * this.gridSize + 1, this.food.y * this.gridSize + 1, this.gridSize - 2, this.gridSize - 2);
            }
            
            update() {
                if (!this.gameRunning) return;
                
                const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };
                
                if (head.x < 0 || head.x >= this.canvas.width / this.gridSize || 
                    head.y < 0 || head.y >= this.canvas.height / this.gridSize) {
                    this.gameOver();
                    return;
                }
                
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }
                
                this.snake.unshift(head);
                
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.scoreElement.textContent = this.score;
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }
            }
            
            gameOver() {
                this.gameRunning = false;
                this.gameOverElement.classList.remove('hidden');
                this.restartBtn.classList.remove('hidden');
            }
            
            start() {
                this.gameRunning = true;
                this.gameStarted = true;
                this.startBtn.classList.add('hidden');
            }
            
            changeDirection(newDx, newDy) {
                if (!this.gameRunning) return;
                if (this.dx === -newDx && this.dy === -newDy) return;
                this.dx = newDx;
                this.dy = newDy;
            }
            
            setupEventListeners() {
                this.startBtn.addEventListener('click', () => this.start());
                this.restartBtn.addEventListener('click', () => { this.reset(); this.start(); });
                
                document.addEventListener('keydown', (e) => {
                    if (!this.gameRunning) return;
                    switch(e.key) {
                        case 'ArrowUp': e.preventDefault(); this.changeDirection(0, -1); break;
                        case 'ArrowDown': e.preventDefault(); this.changeDirection(0, 1); break;
                        case 'ArrowLeft': e.preventDefault(); this.changeDirection(-1, 0); break;
                        case 'ArrowRight': e.preventDefault(); this.changeDirection(1, 0); break;
                    }
                });
            }
            
            gameLoop() {
                this.update();
                this.draw();
            }
        }
        
        const game = new SnakeGame();
        setInterval(() => game.gameLoop(), 150);
    </script>
</body>
</html>
